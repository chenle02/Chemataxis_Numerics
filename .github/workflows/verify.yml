name: Verify data contract

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Validate Paper III manifest
        run: python scripts/validate_paper3_manifest.py

      - name: Validate citation metadata
        run: cffconvert --validate

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Verify legacy Pages snapshot
        shell: bash
        run: |
          changes="$(rsync -acin --checksum \
            --exclude sitemap.xml \
            --exclude sitemap.xml.gz \
            site/ docs/)"
          if [[ -n "${changes}" ]]; then
            echo "docs/ does not contain the current MkDocs snapshot."
            echo "Run: mkdocs build --strict && rsync -a site/ docs/"
            echo "${changes}"
            exit 1
          fi
